<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // مفاتيح مشروعك من الصورة
    const firebaseConfig = {
        apiKey: "AIzaSyBaoWeLtTGQjUBTSdjOIc35DrYap-lyH6c",
        authDomain: "leadership-professional.firebaseapp.com",
        databaseURL: "https://leadership-professional-default-rtdb.firebaseio.com",
        projectId: "leadership-professional",
        storageBucket: "leadership-professional.firebasestorage.app",
        messagingSenderId: "620428076068",
        appId: "1:620428076068:web:f4f0aa97b7282830d1a4b1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentExamData = { fullName: '', callSign: '', discordUser: '', targetRank: '', questionsList: [], theoryAnswersHTML: '' };
    let timerInterval = null;
    let mdtData = { offender: 'لم يحدد', officers: 'لم يحدد', totalMonths: 0, totalFine: 0, tagsHTML: '' };
    let activeModalType = '';

    const policeCharges = [
        { id: 1, name: "عدم حمل رخصة قيادة", type: "green", fine: 1000, months: 0 },
        { id: 2, name: "القيادة بتهور", type: "green", fine: 3000, months: 0 },
        { id: 3, name: "عكس السير", type: "green", fine: 2500, months: 0 },
        { id: 4, name: "القيادة تحت تأثير المسكرات", type: "green", fine: 5000, months: 5 },
        { id: 5, name: "عدم الامتثال للاستيقاف", type: "orange", fine: 4000, months: 5 },
        { id: 6, name: "الهروب من الشرطة", type: "orange", fine: 6000, months: 10 },
        { id: 7, name: "حيازة سلاح غير مرخص", type: "orange", fine: 8000, months: 10 },
        { id: 8, name: "مقاومة اعتقال", type: "orange", fine: 5000, months: 10 },
        { id: 9, name: "سرقة متجر", type: "red", fine: 15000, months: 20 },
        { id: 10, name: "سرقة بنك", type: "red", fine: 50000, months: 50 },
        { id: 11, name: "خطف", type: "red", fine: 25000, months: 30 },
        { id: 12, name: "شروع في قتل عسكري", type: "red", fine: 40000, months: 60 }
    ];
    let selectedCharges = new Set();

    window.checkUserStatus = function() {
        if (localStorage.getItem('has_submitted')) {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('blockedView').classList.remove('hidden');
        }
    }

    window.startExam = async function() {
        let fn = document.getElementById('fullName').value.trim();
        let cs = document.getElementById('callSign').value.trim();
        let du = document.getElementById('discordUser').value.trim();
        let tr = document.getElementById('targetRank').value;

        if (!fn || !cs || !du) return alert("الرجاء تعبئة جميع البيانات!");

        // جلب الأسئلة من فايربيس
        let snapshot = await get(child(ref(db), 'questions_' + tr));
        let savedData = snapshot.exists() ? snapshot.val() : null;

        if (!savedData || !savedData.questions || savedData.questions.length === 0) {
            return alert("عذراً، لم يقم المسؤول بإضافة أسئلة لهذه الرتبة بعد.");
        }

        currentExamData = { fullName: fn, callSign: cs, discordUser: du, targetRank: tr, questionsList: savedData.questions };
        
        document.getElementById('mdtOfficerName').innerText = fn;
        document.getElementById('mdtOfficerRank').innerText = cs + ' | ' + tr;
        document.getElementById('mdtAvatar').innerText = fn.charAt(0);

        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');

        let container = document.getElementById('dynamicQuestionsContainer');
        container.innerHTML = '';
        
        currentExamData.questionsList.forEach((q, i) => {
            let div = document.createElement('div');
            div.className = "bg-[#141a27] border border-slate-800 p-5 rounded-2xl";
            let isMulti = (q.type === 'mcq' && q.options && q.options.length > 0);
            
            let html = `<label class="block text-sm font-bold text-white mb-3">السؤال ${i+1}: ${q.text}</label>`;
            if (isMulti) {
                html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-2">`;
                q.options.forEach(opt => {
                    if(opt) html += `<label class="flex items-center gap-3 bg-[#0c1019] border border-slate-700 p-3 rounded-lg cursor-pointer hover:border-amber-400 transition"><input type="radio" name="ans_${i}" value="${opt}" class="accent-amber-400"><span class="text-xs">${opt}</span></label>`;
                });
                html += `</div>`;
            } else {
                html += `<input type="text" id="ans_${i}" placeholder="اكتب إجابتك..." class="w-full bg-[#0c1019] border border-slate-700 rounded-lg px-4 py-3 text-sm text-slate-200 focus:border-amber-400 outline-none">`;
            }
            div.innerHTML = html;
            container.appendChild(div);
        });

        startTimer((parseInt(savedData.timerMinutes) || 5) * 60);
    }

    window.startTimer = function(duration) {
        let timer = duration, m, s;
        let display = document.getElementById('timerDisplay');
        timerInterval = setInterval(() => {
            m = parseInt(timer / 60, 10); s = parseInt(timer % 60, 10);
            display.textContent = (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
            if (--timer < 0) { clearInterval(timerInterval); submitTheoryExam(); }
        }, 1000);
    }

    window.submitTheoryExam = function() {
        if (timerInterval) clearInterval(timerInterval);
        let html = '';
        currentExamData.questionsList.forEach((q, i) => {
            let userAns = '';
            if (q.type === 'mcq') {
                let sel = document.querySelector(`input[name="ans_${i}"]:checked`);
                userAns = sel ? sel.value : 'لم يُجب';
            } else {
                let inp = document.getElementById('ans_'+i);
                userAns = inp ? inp.value.trim() : 'لم يُجب';
            }
            html += `<div class="mb-2 pb-2 border-b border-slate-700/50 last:border-0"><p class="font-bold text-slate-200">س: ${q.text}</p><p class="text-amber-400 text-[11px] mt-1">الإجابة: ${userAns || 'فارغ'}</p></div>`;
        });
        currentExamData.theoryAnswersHTML = html;
        
        document.getElementById('step2').classList.add('hidden');
        document.getElementById('step3').classList.remove('hidden');
        initTagsGrid();
    }

    window.initTagsGrid = function() {
        let grid = document.getElementById('tagsGrid');
        grid.innerHTML = '';
        policeCharges.forEach(c => {
            let colorClass = c.type === 'green' ? 'bg-emerald-600' : (c.type === 'orange' ? 'bg-orange-500' : 'bg-red-600');
            grid.innerHTML += `
                <div id="charge_${c.id}" onclick="toggleCharge(${c.id})" class="tag-card bg-[#1e293b] border border-slate-600 rounded-lg p-3 cursor-pointer transition flex flex-col justify-between h-24">
                    <div class="text-[11px] font-bold text-white mb-2 leading-tight">${c.name}</div>
                    <div class="flex justify-between items-end mt-auto">
                        <span class="text-[10px] text-slate-300 font-bold">$${c.fine}</span>
                        <span class="${colorClass} text-white text-[9px] px-1.5 py-0.5 rounded font-black">${c.months} شهر</span>
                    </div>
                </div>
            `;
        });
    }

    window.toggleCharge = function(id) {
        let card = document.getElementById('charge_'+id);
        if(selectedCharges.has(id)) {
            selectedCharges.delete(id); card.classList.remove('active');
        } else {
            selectedCharges.add(id); card.classList.add('active');
        }
        updateMdtTotals();
    }

    window.updateMdtTotals = function() {
        mdtData.totalMonths = 0; mdtData.totalFine = 0; mdtData.tagsHTML = '';
        selectedCharges.forEach(id => {
            let c = policeCharges.find(x => x.id === id);
            if(c) {
                mdtData.totalMonths += c.months; mdtData.totalFine += c.fine;
                let color = c.type === 'green' ? 'text-emerald-400' : (c.type === 'orange' ? 'text-orange-400' : 'text-red-400');
                mdtData.tagsHTML += `<span class="${color} text-[10px] block">• ${c.name} (${c.months} شهر | $${c.fine})</span>`;
            }
        });
        document.getElementById('mdtTotalMonths').innerText = mdtData.totalMonths + " شهر";
        document.getElementById('mdtTotalFines').innerText = "$" + mdtData.totalFine;
    }

    window.openMdtModal = function(type) {
        document.getElementById('mdtOverlay').classList.remove('hidden');
        document.getElementById('modal-tags').classList.add('hidden');
        document.getElementById('modal-text').classList.add('hidden');
        
        if (type === 'tags') {
            document.getElementById('modal-tags').classList.remove('hidden');
        } else {
            activeModalType = type;
            document.getElementById('modal-text').classList.remove('hidden');
            document.getElementById('modalTextTitle').innerText = type === 'offender' ? 'تحديد المخالف' : 'العساكر المشاركين';
            document.getElementById('modalTextInput').value = type === 'offender' ? (mdtData.offender !== 'لم يحدد' ? mdtData.offender : '') : (mdtData.officers !== 'لم يحدد' ? mdtData.officers : '');
            document.getElementById('modalTextInput').focus();
        }
    }

    window.closeMdtModals = function() { document.getElementById('mdtOverlay').classList.add('hidden'); }

    window.saveTextModal = function() {
        let val = document.getElementById('modalTextInput').value.trim() || 'لم يحدد';
        if (activeModalType === 'offender') mdtData.offender = val;
        if (activeModalType === 'officers') mdtData.officers = val;
        closeMdtModals();
    }

    window.submitFinalExam = async function() {
        let title = document.getElementById('mdtCaseTitle').value.trim();
        let details = document.getElementById('mdtCaseDetails').value.trim();
        
        if(!title || !details) return alert("يجب كتابة عنوان القضية والتفاصيل!");

        let isBargain = document.getElementById('mdtBargain').checked ? 'نعم' : 'لا';
        let isClosed = document.getElementById('mdtClosed').checked ? 'نعم' : 'لا';
        let type = document.getElementById('mdtCaseType').value;

        let mdtReportHTML = `
            <div class="bg-[#0f172a] p-4 rounded-xl border border-slate-700 text-slate-300 text-xs">
                <div class="flex justify-between border-b border-slate-700 pb-2 mb-3">
                    <span class="font-bold text-white"><span class="text-blue-400">العنوان:</span> ${title} <span class="bg-blue-600/20 text-blue-400 px-2 py-0.5 rounded text-[10px] mr-2">${type}</span></span>
                </div>
                <div class="grid grid-cols-2 gap-2 mb-3 bg-[#1e293b] p-2 rounded">
                    <div><span class="text-slate-400">المخالف:</span> ${mdtData.offender}</div>
                    <div><span class="text-slate-400">العساكر:</span> ${mdtData.officers}</div>
                    <div><span class="text-slate-400">المساومة:</span> ${isBargain}</div>
                    <div><span class="text-slate-400">مغلقة:</span> ${isClosed}</div>
                </div>
                <div class="mb-3">
                    <span class="text-blue-400 font-bold block mb-1">الوسوم والتهم:</span>
                    <div class="bg-[#1e293b] p-2 rounded max-h-24 overflow-y-auto">${mdtData.tagsHTML || '<span class="text-slate-500">لم يتم تحديد تهم</span>'}</div>
                </div>
                <div class="mb-3">
                    <span class="text-blue-400 font-bold block mb-1">التفاصيل:</span>
                    <p class="bg-[#1e293b] p-3 rounded border border-slate-700 whitespace-pre-wrap">${details}</p>
                </div>
                <div class="flex justify-between pt-2 border-t border-slate-700 font-black">
                    <span class="text-red-400">إجمالي السجن: ${mdtData.totalMonths} شهر</span>
                    <span class="text-emerald-400">إجمالي الغرامة: $${mdtData.totalFine}</span>
                </div>
            </div>
        `;

        let subId = Date.now().toString();
        let sub = {
            id: subId,
            fullName: currentExamData.fullName, callSign: currentExamData.callSign,
            discordUser: currentExamData.discordUser, targetRank: currentExamData.targetRank,
            percentage: 'قيد التقييم', qualified: 'قيد التقييم', decision: 'قيد المراجعة',
            answersDetails: currentExamData.theoryAnswersHTML,
            mdtReport: mdtReportHTML
        };

        // رفع الاختبار لفايربيس
        await set(ref(db, 'submissions/' + subId), sub);
        localStorage.setItem('has_submitted', 'true'); // يمنع العسكري يختبر مرتين بنفس الجهاز

        document.getElementById('step3').classList.add('hidden');
        document.getElementById('step4').classList.remove('hidden');
    }

    window.onload = checkUserStatus;
</script>
