<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, get, child, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBaoWeLtTGQjUBTSdjOIc35DrYap-lyH6c",
        authDomain: "leadership-professional.firebaseapp.com",
        databaseURL: "https://leadership-professional-default-rtdb.firebaseio.com",
        projectId: "leadership-professional",
        storageBucket: "leadership-professional.firebasestorage.app",
        messagingSenderId: "620428076068",
        appId: "1:620428076068:web:f4f0aa97b7282830d1a4b1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.checkAcc = function() {
        if (localStorage.getItem('isAdminLoggedIn') === 'true') {
            document.getElementById('adminView').classList.remove('hidden');
            document.getElementById('errorView').classList.add('hidden');
            loadData(); drawQ();
        } else {
            document.getElementById('errorView').classList.remove('hidden');
        }
    }
    
    window.login = function(val) { if(val==='3HH3'||val==='(F!GtqAX!GZ8VU/M)') { localStorage.setItem('isAdminLoggedIn','true'); checkAcc(); } }
    window.logoutAdmin = function() { localStorage.removeItem('isAdminLoggedIn'); location.reload(); }
    
    window.switchTab = function(id) {
        document.querySelectorAll('.tab-content').forEach(e => e.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(b => { b.className = "tab-btn bg-[#0c1019] text-slate-300 border border-slate-800 font-bold px-6 py-3 rounded-xl text-sm flex-1"; });
        document.getElementById('tab-'+id).classList.remove('hidden');
        document.getElementById('tabBtn-'+id).className = "tab-btn bg-amber-400 text-slate-950 font-bold px-6 py-3 rounded-xl text-sm flex-1";
    }

    // جلب الاختبارات من فايربيس
    window.loadData = async function() {
        let snapshot = await get(child(ref(db), 'submissions'));
        let subs = snapshot.exists() ? Object.values(snapshot.val()) : [];
        
        document.getElementById('resultsList').innerHTML = ''; document.getElementById('decisionsList').innerHTML = ''; document.getElementById('dbTbody').innerHTML = '';
        
        subs.forEach((s) => {
            document.getElementById('resultsList').innerHTML += `
            <div class="bg-[#141a27] border border-slate-700 p-5 rounded-2xl relative">
                <button onclick="del('${s.id}')" class="absolute top-3 left-3 text-red-500 text-xs">✕ حذف</button>
                <div class="flex justify-between items-center mb-3">
                    <div><strong class="text-white">${s.fullName}</strong> <span class="bg-blue-500/20 text-blue-400 text-[10px] px-2 rounded">${s.targetRank}</span></div>
                    <button onclick="document.getElementById('det_${s.id}').classList.toggle('hidden')" class="bg-slate-800 px-3 py-1 rounded text-xs">كشف الإجابات</button>
                </div>
                <div id="det_${s.id}" class="hidden space-y-4 pt-3 border-t border-slate-700">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                        <div class="bg-[#0c1019] p-4 rounded-lg border border-slate-800 text-xs text-slate-300">
                            <h3 class="text-amber-400 font-bold mb-2">📝 الاختبار النظري</h3>
                            ${s.answersDetails}
                        </div>
                        <div class="bg-[#0c1019] p-4 rounded-lg border border-slate-800">
                            <h3 class="text-blue-400 font-bold mb-2 text-xs">💻 محاكاة MDT</h3>
                            ${s.mdtReport}
                        </div>
                    </div>
                    <div class="flex gap-2 bg-[#0c1019] p-2 rounded">
                        <input type="text" id="score_${s.id}" value="${s.percentage !== 'قيد التقييم' ? s.percentage : ''}" placeholder="النسبة %" class="bg-[#141a27] p-1.5 text-xs text-white rounded outline-none border border-slate-700">
                        <select id="qual_${s.id}" class="bg-[#141a27] p-1.5 text-xs text-white rounded outline-none border border-slate-700"><option ${s.qualified=='مؤهل'?'selected':''}>مؤهل</option><option ${s.qualified=='غير مؤهل'?'selected':''}>غير مؤهل</option></select>
                        <button onclick="saveEval('${s.id}')" class="bg-amber-400 text-black px-4 rounded text-xs font-bold">حفظ</button>
                    </div>
                </div>
            </div>`;

            document.getElementById('decisionsList').innerHTML += `
            <div class="bg-[#141a27] border border-slate-700 p-4 rounded-xl flex justify-between items-center">
                <div><span class="text-white text-sm font-bold">${s.fullName}</span> <span class="text-xs text-slate-400">(${s.percentage})</span></div>
                <div class="flex gap-2">
                    <button onclick="setDec('${s.id}', 'قبول')" class="bg-emerald-600 px-3 py-1 rounded text-xs text-white">قبول</button>
                    <button onclick="setDec('${s.id}', 'رفض')" class="bg-red-600 px-3 py-1 rounded text-xs text-white">رفض</button>
                    <button onclick="setDec('${s.id}', 'فرصة ثانية')" class="bg-amber-600 px-3 py-1 rounded text-xs text-white">إعادة</button>
                </div>
            </div>`;

            document.getElementById('dbTbody').innerHTML += `<tr class="border-b border-slate-800"><td class="p-3 text-white">${s.fullName}</td><td class="p-3">${s.targetRank}</td><td class="p-3">${s.percentage}</td><td class="p-3">${s.decision}</td></tr>`;
        });
    }

    window.saveEval = async function(id) {
        let p = document.getElementById('score_'+id).value; 
        let q = document.getElementById('qual_'+id).value;
        await update(ref(db, 'submissions/' + id), { percentage: p, qualified: q });
        loadData(); alert('تم الحفظ بالخادم السحابي!');
    }
    
    window.setDec = async function(id, d) {
        await update(ref(db, 'submissions/' + id), { decision: d });
        loadData();
    }
    
    window.del = async function(id) {
        if(confirm('متأكد؟')){ await remove(ref(db, 'submissions/' + id)); loadData(); }
    }

    // إدارة الأسئلة السحابية
    window.drawQ = async function() {
        let rank = document.getElementById('qRank').value; 
        let count = document.getElementById('qCount').value;
        
        let snapshot = await get(child(ref(db), 'questions_' + rank));
        let saved = snapshot.exists() ? snapshot.val() : {questions:[], timerMinutes:5};
        
        document.getElementById('qTime').value = saved.timerMinutes || 5;
        let html = '';
        for(let i=0; i<count; i++) {
            let q = saved.questions[i] || {text:'', type:'essay', options:['','','','']};
            html += `<div class="bg-[#141a27] p-3 rounded border border-slate-700">
                <input type="text" id="qt_${i}" value="${q.text}" placeholder="نص السؤال" class="w-full bg-[#0c1019] p-2 text-xs text-white rounded mb-2">
                <select id="qty_${i}" onchange="document.getElementById('qo_${i}').style.display = this.value==='mcq'?'grid':'none'" class="bg-[#0c1019] p-1 text-xs text-white rounded w-full mb-2"><option value="essay" ${q.type=='essay'?'selected':''}>مقال</option><option value="mcq" ${q.type=='mcq'?'selected':''}>خيارات</option></select>
                <div id="qo_${i}" style="display:${q.type=='mcq'?'grid':'none'}" class="grid-cols-2 gap-2"><input id="qo_${i}_0" value="${q.options[0]}" class="bg-[#0c1019] p-1 text-xs text-white rounded"><input id="qo_${i}_1" value="${q.options[1]}" class="bg-[#0c1019] p-1 text-xs text-white rounded"><input id="qo_${i}_2" value="${q.options[2]}" class="bg-[#0c1019] p-1 text-xs text-white rounded"><input id="qo_${i}_3" value="${q.options[3]}" class="bg-[#0c1019] p-1 text-xs text-white rounded"></div>
            </div>`;
        }
        document.getElementById('qBox').innerHTML = html;
    }
    
    window.loadQ = function() { drawQ(); }
    
    window.saveQ = async function() {
        let rank = document.getElementById('qRank').value; let count = document.getElementById('qCount').value; let time = document.getElementById('qTime').value;
        let qs = [];
        for(let i=0; i<count; i++) {
            let text = document.getElementById('qt_'+i).value; let type = document.getElementById('qty_'+i).value;
            if(text) qs.push({text:text, type:type, options:[document.getElementById(`qo_${i}_0`)?.value||'',document.getElementById(`qo_${i}_1`)?.value||'',document.getElementById(`qo_${i}_2`)?.value||'',document.getElementById(`qo_${i}_3`)?.value||'']});
        }
        await set(ref(db, 'questions_' + rank), {questions:qs, timerMinutes:time});
        alert('تم رفع الأسئلة للقاعدة السحابية بنجاح!');
    }

    window.onload = checkAcc;
</script>
